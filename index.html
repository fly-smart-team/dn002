<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="공항CCTV">
<meta name="theme-color" content="#0f172a">
<title>공항 가는 길 CCTV</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
<style>
  :root{--bg:#0f172a;--card:#1e293b;--line:#334155;--txt:#e2e8f0;--sub:#94a3b8;--acc:#38bdf8;--g:#22c55e;--y:#eab308;--r:#ef4444;--n:#475569;--err:#f87171}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;padding-bottom:calc(20px + env(safe-area-inset-bottom))}
  header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(8px + env(safe-area-inset-top)) 10px 8px;border-bottom:1px solid var(--line)}
  .row{display:flex;align-items:center;gap:8px}
  h1{font-size:16px;margin:0;flex:1}
  #eta{font-size:13px;color:var(--sub);margin-top:4px}
  #eta b{font-size:20px;color:var(--txt);margin-right:6px}
  button{font:inherit;color:var(--txt);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 10px}
  button.on{background:var(--acc);color:#0f172a;border-color:var(--acc);font-weight:700}
  input,select{font:inherit;width:100%;background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
  #status{font-size:12px;color:var(--sub);padding:6px 10px}
  #status.err{color:var(--err);white-space:pre-wrap;word-break:break-all}
  #route{padding:0 8px}
  .node,.seg{display:grid;grid-template-columns:36% 1fr;column-gap:8px}
  .node .l{display:flex;align-items:center;gap:6px;font-weight:700;font-size:13px;padding:2px 0}
  .node .dot{width:14px;height:14px;border-radius:50%;background:var(--bg);border:3px solid var(--txt);margin-left:1px;flex:none}
  .node.end .dot{background:var(--acc);border-color:var(--acc)}
  .seg .l{display:flex;gap:8px;min-height:64px}
  .seg .rail{width:10px;border-radius:5px;margin-left:3px;flex:none}
  .seg .info{display:flex;flex-direction:column;justify-content:center;font-size:11px;color:var(--sub);gap:2px;padding:6px 0}
  .seg .info .sp{font-size:18px;font-weight:800}
  .seg .info .sp small{font-size:11px;font-weight:600;margin-left:2px}
  .seg .r{display:flex;flex-direction:column;gap:6px;padding:6px 0}
  .none{font-size:11px;color:var(--n);padding:4px 0}
  .tile{position:relative;background:#000;border-radius:9px;overflow:hidden;aspect-ratio:16/10;border:1px solid var(--line)}
  .tile video,.tile img{width:100%;height:100%;object-fit:cover;display:block}
  .tile .cap{position:absolute;left:0;right:0;bottom:0;padding:12px 6px 3px;font-size:11px;background:linear-gradient(transparent,rgba(0,0,0,.85));display:flex;gap:4px;align-items:flex-end}
  .tile.dead{opacity:.55}
  .tile .cap .n{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tile.flip video,.tile.flip img,#player.flip #vid,#player.flip #pImg{transform:scaleX(-1)}
  .fl{position:absolute;top:5px;right:5px;z-index:2;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:8px;padding:2px 7px;font-size:13px}
  .tile.flip .fl{background:var(--acc);color:#0f172a;border-color:var(--acc)}
  .spd{font-weight:800;padding:0 5px;border-radius:5px;color:#0f172a;font-size:11px}
  .legend{font-size:11px;color:var(--sub);padding:10px}
  .legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin:0 3px 0 8px;vertical-align:-1px}
  #player,#settings{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:10;display:none;flex-direction:column;padding:calc(12px + env(safe-area-inset-top)) 12px 12px}
  #player.show,#settings.show{display:flex}
  #pTitle{flex:1;font-weight:700;font-size:14px}
  #vid,#pImg{width:100%;max-height:70vh;background:#000;border-radius:10px;margin-top:10px}
  #pImg{display:none;object-fit:contain}
  .nav{margin-top:10px}.nav button{flex:1}
  #settings .box{background:var(--card);border-radius:14px;padding:16px;margin-top:16px;overflow:auto}
  #settings label{display:block;font-size:13px;color:var(--sub);margin:12px 0 4px}
  .hint{font-size:12px;color:var(--sub);margin-top:6px;line-height:1.5}
  #dbg{font-size:11px;color:var(--sub);white-space:pre-wrap;word-break:break-all;margin-top:8px;max-height:30vh;overflow:auto}
</style>
</head>
<body>
<header>
  <div class="row">
    <h1>✈️ 이산포IC → 인천공항 T2</h1>
    <button id="btnRefresh" title="새로고침">⟳</button>
    <button id="btnSet" title="설정">⚙︎</button>
  </div>
  <div id="eta">계산 중…</div>
</header>
<div id="status">불러오는 중…</div>
<div id="route"></div>
<div class="legend"><i style="background:var(--g)"></i>원활 70+ <i style="background:var(--y)"></i>서행 30–70 <i style="background:var(--r)"></i>정체 30↓ <i style="background:var(--n)"></i>정보 없음 (km/h, 공항 방향)</div>

<div id="player">
  <div class="row"><div id="pTitle"></div><button id="pFlip">⇄ 반전</button><button id="pClose">닫기</button></div>
  <video id="vid" playsinline muted autoplay controls></video>
  <img id="pImg" alt="">
  <div class="row nav"><button id="pPrev">◀ 이전</button><button id="pNext">다음 ▶</button></div>
  <div class="hint" id="pMsg"></div>
</div>

<div id="settings">
  <div class="row"><div style="flex:1;font-weight:700">설정</div><button id="sClose">닫기</button></div>
  <div class="box">
    <label>ITS 인증키</label>
    <input id="sKey" placeholder="마이페이지의 인증키">
    <label>영상 유형</label>
    <select id="sType">
      <option value="4">실시간 HLS (HTTPS) — 권장</option>
      <option value="1">실시간 HLS (HTTP)</option>
      <option value="3">정지영상</option>
    </select>
    <label>경로 폭 (경로에서 이 거리 안의 CCTV만)</label>
    <select id="sBuf">
      <option value="0.5">0.5 km — 도로 위만</option>
      <option value="1.0">1.0 km — 기본</option>
      <option value="2.0">2.0 km — 넓게</option>
    </select>
    <label>중계 서버 주소 (선택)</label>
    <input id="sProxy" placeholder="비워두면 ITS 서버 직접 호출">
    <div class="hint">경로: 이산포JC → 킨텍스IC → 장항IC → 자유로JC → 김포대교 → 김포IC → 노오지JC → 청라IC → 북인천IC → 영종대교 → 금산IC → 공항입구JC → 영종해안북로 → 제2여객터미널.<br>CCTV는 화면에 보이는 것만 재생합니다. 영상을 누르면 크게 봅니다. ⇄ 버튼은 카메라별 좌우 반전이며 이 기기에 저장됩니다.<br>호출 절약: CCTV 10분, 속도 3분 저장.</div>
    <div class="row" style="margin-top:14px"><button id="sSave" class="on" style="flex:1">저장</button></div>
    <label>진단 정보 (문제 생기면 캡처해서 보내주세요)</label>
    <div id="dbg">-</div>
  </div>
</div>

<script>
// ===== 경로 노드 (이름, 경도, 위도, 다음 구간 도로) — 공항 방향 순서 =====
const NODES = [
  ['이산포JC',    126.720,37.660,'자유로'],
  ['킨텍스IC',    126.738,37.657,'자유로'],
  ['장항IC',      126.770,37.645,'자유로'],
  ['자유로JC',    126.796,37.622,'제1순환'],
  ['김포대교',    126.799,37.610,'제1순환'],
  ['김포IC',      126.786,37.598,'제1순환'],
  ['노오지JC',    126.771,37.588,'공항고속도로'],
  ['청라IC',      126.664,37.566,'공항고속도로'],
  ['북인천IC',    126.620,37.553,'공항고속도로'],
  ['영종대교',    126.560,37.545,'공항고속도로'],
  ['금산IC',      126.535,37.535,'공항고속도로'],
  ['공항입구JC',  126.522,37.527,'영종해안북로'],
  ['영종해안북로',126.475,37.506,'제2터미널대로'],
  ['인천공항 T2', 126.434,37.467,'']
];
const SHAPE = {11:[[126.495,37.516]], 12:[[126.452,37.494],[126.440,37.480]]};
const ROUTE_ROADS = /자유로|77호|제1순환|외곽순환|순환고속|인천국제공항|공항고속|신공항|영종해안북로|해안북로|제2터미널|공항대로/;
const BBOX = {minX:126.41, maxX:126.83, minY:37.45, maxY:37.70};
const EXCLUDE = /제2외곽|인천김포|북청라|검단양촌/; // 경로와 나란한 다른 도로
const MAX_PLAY = 4; // 동시 재생 수 (브라우저 연결 제한)
const BASE = 'https://openapi.its.go.kr:9443';
const CCTV_MS = 5*60*1000, TRAF_MS = 3*60*1000;

const $ = id => document.getElementById(id);
const store = {
  get:(k,d)=>{try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},
  set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
let cfg = Object.assign({key:'',type:'4',buf:'1.0',proxy:''}, store.get('cfg',{}));
if(!['0.5','1.0','2.0'].includes(cfg.buf)) cfg.buf='1.0';
let flips=new Set(store.get('flips',[]));
const toggleFlip=name=>{flips.has(name)?flips.delete(name):flips.add(name);store.set('flips',[...flips]);};
let cams=[], linkSpeed={}, cur=-1, popHls=null, dbg={};
const tiles = new Map();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function status(m,e){const s=$('status');s.textContent=m;s.className=e?'err':''}
const colorOf = v => !(v>0)?'var(--n)':v>=70?'var(--g)':v>=30?'var(--y)':'var(--r)';
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const avg=a=>a.reduce((s,v)=>s+v,0)/a.length;

// ===== 경로 기하 =====
const ROUTE=[]; NODES.forEach((n,i)=>{ROUTE.push([n[1],n[2]]); (SHAPE[i]||[]).forEach(p=>ROUTE.push(p));});
const O=ROUTE[0], toKm=(lon,lat)=>[(lon-O[0])*88.2,(lat-O[1])*111.0];
const SEG=(()=>{let cum=0;const out=[];for(let i=0;i<ROUTE.length-1;i++){const a=toKm(...ROUTE[i]),b=toKm(...ROUTE[i+1]);const len=Math.hypot(b[0]-a[0],b[1]-a[1]);out.push({a,b,len,cum});cum+=len}return out})();
const TOTAL=SEG.reduce((s,x)=>s+x.len,0);
function project(lon,lat){
  const p=toKm(lon,lat); let best={d:1e9,along:0};
  for(const s of SEG){const dx=s.b[0]-s.a[0],dy=s.b[1]-s.a[1];
    let t=((p[0]-s.a[0])*dx+(p[1]-s.a[1])*dy)/(s.len*s.len); t=Math.max(0,Math.min(1,t));
    const d=Math.hypot(p[0]-(s.a[0]+t*dx),p[1]-(s.a[1]+t*dy));
    if(d<best.d) best={d,along:s.cum+t*s.len};}
  return best;
}
const NODE_AL = NODES.map(n=>project(n[1],n[2]).along);
const segOf = al => { for(let i=NODES.length-2;i>=0;i--) if(al>=NODE_AL[i]) return i; return 0; };

// ===== API =====
async function api(path, params){
  const base=(cfg.proxy||BASE).replace(/\/$/,'');
  const p=new URLSearchParams(Object.assign({apiKey:cfg.key,getType:'json',
    minX:BBOX.minX,maxX:BBOX.maxX,minY:BBOX.minY,maxY:BBOX.maxY},params));
  const r=await fetch(`${base}/${path}?${p}`); const txt=await r.text();
  let j; try{j=JSON.parse(txt)}catch(e){throw new Error(path+' 응답 해석 실패\n'+txt.slice(0,300))}
  let d=j?.response?.data ?? j?.body?.items ?? j?.data ?? j?.items ?? [];
  if(!Array.isArray(d)) d=[d];
  return d.filter(Boolean);
}

async function loadCams(force){
  const ck='cctv_'+cfg.type, c=store.get(ck,null); let raw;
  if(!force && c && Date.now()-c.t<CCTV_MS) raw=c.d;
  else{ raw=(await api('cctvInfo',{type:'all',cctvType:cfg.type})).filter(o=>o.cctvurl)
          .map(o=>({name:(o.cctvname||'').trim(),url:o.cctvurl,x:+o.coordx,y:+o.coordy,fmt:o.cctvformat||'',link:String(o.roadsectionid||'')}));
        store.set(ck,{t:Date.now(),d:raw}); }
  const buf=+cfg.buf, seen=new Set();
  cams = raw.map(o=>Object.assign({},o,project(o.x,o.y)))
    .filter(o=>o.d<=buf && !EXCLUDE.test(o.name) && !seen.has(o.name) && seen.add(o.name))
    .sort((a,b)=>a.along-b.along);
  cams.forEach(c=>c.seg=segOf(c.along));
  dbg.camsAll=raw.length; dbg.camsRoute=cams.length;
}

// 구간마다 좁은 영역(BBOX)으로 소통정보 조회 → 링크가 어느 구간에 있는지 알 수 있음
function segBox(i){
  const pts=[[NODES[i][1],NODES[i][2]],[NODES[i+1][1],NODES[i+1][2]],...(SHAPE[i]||[])];
  const xs=pts.map(p=>p[0]), ys=pts.map(p=>p[1]), pad=0.004;
  return {minX:Math.min(...xs)-pad,maxX:Math.max(...xs)+pad,minY:Math.min(...ys)-pad,maxY:Math.max(...ys)+pad};
}
async function trafficCall(box){
  const base=(cfg.proxy||BASE).replace(/\/$/,'');
  const p=new URLSearchParams(Object.assign({apiKey:cfg.key,getType:'json',type:'all',drcType:'all'},box));
  const r=await fetch(`${base}/trafficInfo?${p}`); const txt=await r.text();
  let j; try{j=JSON.parse(txt)}catch(e){throw new Error('trafficInfo 응답 해석 실패\n'+txt.slice(0,200))}
  let d=j?.body?.items ?? j?.response?.data ?? j?.items ?? j?.data ?? [];
  if(!Array.isArray(d)) d=[d];
  if(!d.length){ const h=j?.header||j?.response?.header||{}; dbg.trafficMsg=(h.resultMsg||h.resultCode||txt.slice(0,150)); }
  return d.filter(Boolean).map(o=>({road:(o.roadName||'').trim(),link:String(o.linkId||''),
    s:String(o.startNodeId||''),e:String(o.endNodeId||''),spd:+o.speed}));
}
async function loadTraffic(force){
  const c=store.get('traffic2',null);
  if(!force && c && Date.now()-c.t<TRAF_MS) return c.d;
  const n=NODES.length-1, per=new Array(n).fill(null);
  const one=async i=>{ for(let a=0;a<2;a++){ try{ return await trafficCall(segBox(i)); }catch(e){ dbg.trafficErr=e.message; await sleep(600); } } return null; };
  for(let i=0;i<n;i+=3){ const r=await Promise.all([i,i+1,i+2].filter(k=>k<n).map(one)); r.forEach((v,k)=>per[i+k]=v); }
  // 실패한 구간은 이전 정보로 채움
  const prev=c?.d||[]; let filled=0;
  per.forEach((v,i)=>{ if(!v||!v.length){ if(prev[i]&&prev[i].length){ per[i]=prev[i]; filled++; } else per[i]=[]; } });
  const got=per.filter(v=>v.length).length;
  dbg.trafficOk=`${got}/${n} 구간` + (filled?` (이전 정보 ${filled}개)`:'');
  if(got && filled<got) store.set('traffic2',{t:Date.now(),d:per});
  if(!got) dbg.trafficFail=true;
  return per; // per[i] = 구간 i 영역의 링크들
}

// 공항 방향 판별: 링크를 노드로 이어 체인을 만들고, 체인을 따라 구간 번호가 커지면 공항 방향
function segmentSpeeds(per){
  const L={}; // link -> {..., segs:Set}
  per.forEach((arr,i)=>arr.forEach(o=>{ if(!o.link) return; (L[o.link]=L[o.link]||Object.assign({segs:new Set()},o)).segs.add(i); }));
  const all=Object.values(L);
  const roadLinks=all.filter(l=>ROUTE_ROADS.test(l.road)&&l.s&&l.e);
  const links=roadLinks.length?roadLinks:all.filter(l=>l.s&&l.e);
  const byStart=new Map(); links.forEach(l=>{ if(!byStart.has(l.s)) byStart.set(l.s,[]); byStart.get(l.s).push(l); });
  const ends=new Set(links.map(l=>l.e)), used=new Set(), chains=[];
  const walk=h=>{const c=[];let x=h;while(x&&!used.has(x.link)){used.add(x.link);c.push(x);
    const nx=(byStart.get(x.e)||[]).filter(n=>!used.has(n.link)&&n.e!==x.s); x=nx.find(n=>n.road===x.road)||nx[0];}return c};
  links.filter(l=>!ends.has(l.s)).forEach(h=>{const c=walk(h);if(c.length)chains.push(c)});
  links.forEach(l=>{if(!used.has(l.link)){const c=walk(l);if(c.length)chains.push(c)}});
  const mid=l=>{const a=[...l.segs];return a.reduce((s,v)=>s+v,0)/a.length};
  const segVals=NODES.map(()=>[]); linkSpeed={}; let fwd=0, fwdLinks=0;
  chains.forEach(ch=>{
    if(ch.length<2) return;
    const first=mid(ch[0]), last=mid(ch[ch.length-1]);
    if(!(last>first)) return; // 구간 번호가 증가해야 공항 방향
    fwd++;
    ch.forEach(l=>{ if(l.spd>0){ fwdLinks++; linkSpeed[l.link]=l.spd; l.segs.forEach(i=>segVals[i].push(l.spd)); } });
  });
  dbg.links=all.length; dbg.routeLinks=roadLinks.length; dbg.chains=chains.length; dbg.fwdChains=fwd; dbg.fwdLinks=fwdLinks;
  dbg.perSeg=per.map(a=>a.length).join(',');
  dbg.roads=[...new Set(all.map(l=>l.road))].slice(0,40).join(', ');
  dbg.camLinkMatch=cams.filter(c=>L[c.link]).length;
  dbg.camNames=cams.map(c=>`${NODES[c.seg][0]}|${c.name}|${c.d.toFixed(2)}`).join('\n');
  return NODES.map((n,i)=>segVals[i].length?{v:avg(segVals[i])}:{v:0});
}

// ===== 렌더 =====
const visible=new Set();
const io=new IntersectionObserver(es=>{ es.forEach(e=>{ e.isIntersecting?visible.add(e.target):visible.delete(e.target); }); schedule(); },{threshold:0.35});
let schedT=null;
function schedule(){ clearTimeout(schedT); schedT=setTimeout(()=>{
  if($('player').classList.contains('show')) return;
  const order=[...tiles.keys()].filter(el=>visible.has(el)).slice(0,MAX_PLAY);
  tiles.forEach((t,el)=>{ if(!order.includes(el)) stopTile(t); });
  order.forEach(el=>startTile(el,tiles.get(el)));
},150); }

function render(sp){
  tiles.forEach((t,el)=>{stopTile(t);io.unobserve(el)}); tiles.clear(); visible.clear();
  const R=$('route'); R.innerHTML='';
  let mins=0, known=0;
  NODES.forEach((n,i)=>{
    const nd=document.createElement('div'); nd.className='node'+(i===NODES.length-1?' end':'');
    nd.innerHTML=`<div class="l"><span class="dot"></span>${esc(n[0])}</div><div></div>`; R.appendChild(nd);
    if(i===NODES.length-1) return;
    const len=NODE_AL[i+1]-NODE_AL[i], s=sp[i];
    if(s.v>0){ mins+=len/s.v*60; known+=len; }
    const sg=document.createElement('div'); sg.className='seg';
    sg.innerHTML=`<div class="l"><div class="rail" style="background:${colorOf(s.v)}"></div>
      <div class="info"><span class="sp" style="color:${colorOf(s.v)}">${s.v>0?s.v.toFixed(0):'—'}<small>${s.v>0?'km/h':''}</small></span>
      <span>${esc(n[3])} · ${len.toFixed(1)}km</span></div></div>`;
    const right=document.createElement('div'); right.className='r';
    const list=cams.filter(c=>c.seg===i);
    if(!list.length) right.innerHTML='<div class="none">CCTV 없음</div>';
    list.forEach(c=>{
      const el=document.createElement('div'); el.className='tile'+(flips.has(c.name)?' flip':'');
      const v=linkSpeed[c.link];
      el.innerHTML=`<div class="cap"><span class="n">${esc(c.name)}</span>${v>0?`<span class="spd" style="background:${colorOf(v)}">${v}</span>`:''}</div>`;
      const fb=document.createElement('button'); fb.className='fl'; fb.textContent='⇄'; fb.title='좌우 반전';
      fb.onclick=e=>{e.stopPropagation(); toggleFlip(c.name); el.classList.toggle('flip',flips.has(c.name));};
      el.appendChild(fb);
      el.onclick=()=>openPlayer(cams.indexOf(c));
      right.appendChild(el); tiles.set(el,{cam:c,hls:null,media:null}); io.observe(el);
    });
    sg.appendChild(right); R.appendChild(sg);
  });
  const totalLen=NODE_AL[NODE_AL.length-1]-NODE_AL[0];
  if(known>0){ const est=mins*totalLen/known; $('eta').innerHTML=`<b>약 ${Math.round(est)}분</b>${totalLen.toFixed(0)}km · CCTV ${cams.length}개${known<totalLen*0.9?' · 일부 구간 정보 없음':''}`; }
  else $('eta').textContent=`${totalLen.toFixed(0)}km · CCTV ${cams.length}개 · 속도 정보 없음`+(dbg.trafficFail?` (${dbg.trafficMsg||dbg.trafficErr||'ITS 응답 없음'})`:'');
}

const isImg=c=>/jpe?g|png/i.test(c.fmt)||/\.(jpe?g|png)(\?|$)/i.test(c.url);
function attach(v,url,onErr){
  if(v.canPlayType('application/vnd.apple.mpegurl')){ v.src=url; return null; }
  if(window.Hls&&Hls.isSupported()){ const h=new Hls({maxBufferLength:6,backBufferLength:0,manifestLoadingMaxRetry:2,levelLoadingMaxRetry:2,fragLoadingMaxRetry:3});
    h.loadSource(url); h.attachMedia(v); h.on(Hls.Events.ERROR,(e,d)=>{if(d.fatal)onErr&&onErr()}); return h; }
  v.src=url; return null;
}
function startTile(el,t){
  if(t.media) return;
  if(isImg(t.cam)){ const im=document.createElement('img'); im.src=t.cam.url; el.prepend(im); t.media=im; return; }
  const v=document.createElement('video'); v.muted=true; v.playsInline=true; v.autoplay=true; v.setAttribute('playsinline','');
  el.prepend(v); t.media=v;
  const fail=()=>{ if(t.media!==v) return; clearTimeout(t.timer); retryTile(el,t); };
  t.hls=attach(v,t.cam.url,fail);
  v.play().catch(()=>{});
  t.timer=setTimeout(()=>{ if(t.media===v && !(v.readyState>=2)) fail(); },8000);
  v.addEventListener('playing',()=>{ t.tries=0; el.querySelector('.cap .n').textContent=t.cam.name; },{once:true});
}
// 스트림 주소가 만료됐을 수 있으므로 목록을 새로 받아 다시 시도 (1분에 1번만 새로 받음)
let urlRefreshAt=0, urlRefreshing=null;
async function freshUrls(){
  if(Date.now()-urlRefreshAt<60000) return urlRefreshing;
  urlRefreshAt=Date.now();
  urlRefreshing=api('cctvInfo',{type:'all',cctvType:cfg.type}).then(d=>{
    const m={}; d.forEach(o=>{ if(o.cctvurl) m[(o.cctvname||'').trim()]=o.cctvurl; });
    cams.forEach(c=>{ if(m[c.name]) c.url=m[c.name]; });
    const ck='cctv_'+cfg.type, cc=store.get(ck,null); if(cc){ cc.d.forEach(o=>{ if(m[o.name]) o.url=m[o.name]; }); cc.t=Date.now(); store.set(ck,cc); }
  }).catch(()=>{});
  return urlRefreshing;
}
async function retryTile(el,t){
  const cap=el.querySelector('.cap .n');
  t.tries=(t.tries||0)+1;
  if(t.tries>2){ stopTile(t); cap.textContent='⚠️ 영상 없음 · '+t.cam.name; el.classList.add('dead'); return; }
  cap.textContent='⏳ 다시 연결 중 · '+t.cam.name;
  stopTile(t); await freshUrls(); await sleep(400);
  if(visible.has(el)) startTile(el,t);
}
function stopTile(t){
  clearTimeout(t.timer);
  if(t.hls){t.hls.destroy();t.hls=null}
  if(t.media){ if(t.media.tagName==='VIDEO'){t.media.pause();t.media.removeAttribute('src');t.media.load()} t.media.remove(); t.media=null; }
}

// ===== 크게 보기 =====
function openPlayer(i){
  if(i<0||i>=cams.length) return; cur=i; const c=cams[i], v=$('vid'), im=$('pImg');
  tiles.forEach(stopTile);
  const s=linkSpeed[c.link];
  $('pTitle').textContent=`${NODES[c.seg][0]}→${NODES[c.seg+1][0]} · ${c.name}${s>0?` · ${s}km/h`:''}`; $('pMsg').textContent='';
  $('player').classList.add('show'); $('player').classList.toggle('flip',flips.has(c.name)); stopPop();
  if(isImg(c)){ v.style.display='none'; im.style.display='block'; im.src=c.url; return; }
  im.style.display='none'; v.style.display='block';
  popHls=attach(v,c.url,()=>{$('pMsg').textContent='영상 재생 실패 — ⟳로 새로 받아 보세요.'}); v.play().catch(()=>{});
}
function stopPop(){const v=$('vid'); if(popHls){popHls.destroy();popHls=null} v.pause(); v.removeAttribute('src'); v.load();}
function closePlayer(){ stopPop(); $('player').classList.remove('show'); schedule(); }

// ===== 실행 =====
async function load(force){
  if(!cfg.key){ status('⚙︎ 설정에서 인증키를 먼저 입력하세요.',true); openSettings(); return; }
  status('불러오는 중…'); const errs=[]; let traffic=[]; dbg={};
  await loadCams(force).catch(e=>errs.push('CCTV: '+e.message));
  await loadTraffic(force).then(r=>traffic=r).catch(e=>errs.push('속도: '+e.message));
  render(segmentSpeeds(traffic));
  const now=new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});
  if(dbg.trafficMsg&&!dbg.links) errs.push('속도: '+dbg.trafficMsg); if(dbg.trafficErr&&!dbg.links) errs.push('속도: '+dbg.trafficErr);
  errs.length?status(errs.join('\n'),true):status(`${now} 기준 · 동시 재생 ${MAX_PLAY}개 (스크롤하면 바뀜)`);
  $('dbg').textContent=JSON.stringify(dbg,null,1);
}
function openSettings(){ $('sKey').value=cfg.key; $('sType').value=cfg.type; $('sBuf').value=cfg.buf; $('sProxy').value=cfg.proxy; $('settings').classList.add('show'); }

$('btnRefresh').onclick=()=>load(true);
$('btnSet').onclick=openSettings;
$('sClose').onclick=()=>$('settings').classList.remove('show');
$('sSave').onclick=()=>{ Object.assign(cfg,{key:$('sKey').value.trim(),type:$('sType').value,buf:$('sBuf').value,proxy:$('sProxy').value.trim()}); store.set('cfg',cfg); $('settings').classList.remove('show'); load(true); };
$('pClose').onclick=closePlayer;
$('pFlip').onclick=()=>{ const c=cams[cur]; if(!c) return; toggleFlip(c.name); $('player').classList.toggle('flip',flips.has(c.name));
  tiles.forEach((t,el)=>{ if(t.cam.name===c.name) el.classList.toggle('flip',flips.has(c.name)); }); };
$('pPrev').onclick=()=>openPlayer(cur-1);
$('pNext').onclick=()=>openPlayer(cur+1);
document.addEventListener('visibilitychange',()=>{ if(document.hidden) tiles.forEach(stopTile); else load(false); });

load(false);
</script>
</body>
